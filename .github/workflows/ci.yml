name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nomadcore
          POSTGRES_PASSWORD: nomadcore
          POSTGRES_DB: nomadcore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nomadcore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Prisma migrate (validate migrations apply cleanly)
        run: pnpm --filter @nomadcore/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://nomadcore:nomadcore@localhost:5432/nomadcore_test
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://nomadcore:nomadcore@localhost:5432/nomadcore_test
